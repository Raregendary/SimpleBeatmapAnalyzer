[package]
name = "simple-beatmap-analyzer"
version = "0.10.0"
edition = "2021"
authors = ["Raregendary <raregendary@gmail.com>"]
license = "MIT"
description = "Library and CLI for analyzing osu! beatmaps: stars, PP and advanced pattern statistics"
readme = "README.md"
homepage = "https://github.com/Raregendary/SimpleBeatmapAnalyzer"
repository = "https://github.com/Raregendary/SimpleBeatmapAnalyzer"
keywords = ["osu", "beatmap", "pp", "stars", "streams"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "simple_beatmap_analyzer"
path = "src/lib.rs"

[[bin]]
name = "sba"
path = "src/bin/sba.rs"

[dependencies]
bincode = "1.3.3"
csv = "1.2.2"
indicatif = "0.17.6"
jwalk = "0.8.1"
md-5 = "0.10.5"
rayon = "1.7.0"
rosu-pp = "0.9.5"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
